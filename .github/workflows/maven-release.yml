name: Maven Release

on:
  release:
    # Not `created`: GitHub doesn't send it when a draft release is published.
    types: [ published ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          overwrite-settings: false

      # Central can't replace a published version, so deploy only what the tag names.
      - name: Check release version
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          version="$(mvn -B -q -N -DforceStdout help:evaluate -Dexpression=project.version)"
          echo "Release tag: ${TAG}"
          echo "Project version: ${version}"

          if [[ "${version}" == *-SNAPSHOT ]]; then
            echo "::error::Refusing to release SNAPSHOT version ${version}."
            exit 1
          fi

          if [[ "${TAG}" != "v${version}" ]]; then
            echo "::error::Tag ${TAG} doesn't match project version ${version}. Expected v${version}."
            exit 1
          fi

      - name: Install GPG secret key
        run: |
          cat <(echo -e "${{ secrets.OSSRH_GPG_SECRET_KEY }}") | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

      - name: Publish to Maven Central
        run: |
          mvn -B --version
          mvn -B --settings .github/maven-settings.xml clean deploy -P release
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
